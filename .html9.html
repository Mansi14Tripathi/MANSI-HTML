<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #202124;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      border-radius: 20px;
      background: #303134;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #171717;
      color: white;
      text-align: right;
      font-size: 2rem;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      background: #505050;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #686868;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #ff9500;
    }

    .operator:hover {
      background: #ffad33;
    }

    .clear {
      background: #d9534f;
    }

    .equals {
      background: #28a745;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" value="0" readonly />

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button data-action="delete">DEL</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value=".">.</button>

      <button data-value="0">0</button>
      <button class="equals" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let justCalculated = false;

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (action === "clear") {
          display.value = "0";
          justCalculated = false;
        }

        if (action === "delete") {
          display.value = display.value.length > 1
            ? display.value.slice(0, -1)
            : "0";
        }

        if (action === "calculate") {
          calculate();
        }

        if (value) {
          addValue(value);
        }
      });
    });

    function addValue(value) {
      if (display.value === "Error") {
        display.value = "0";
      }

      const isOperator = /[+\-*/]/.test(value);

      if (justCalculated) {
        if (!isOperator) {
          display.value = "";
        }
        justCalculated = false;
      }

      if (isOperator && /[+\-*/]$/.test(display.value)) {
        display.value = display.value.slice(0, -1);
      }

      if (value === ".") {
        const currentNumber = display.value.split(/[+\-*/]/).pop();

        if (currentNumber.includes(".")) return;

        if (display.value === "0" || /[+\-*/]$/.test(display.value)) {
          display.value += display.value === "0" ? "." : "0.";
          return;
        }
      }

      if (display.value === "0" && !isOperator && value !== ".") {
        display.value = "";
      }

      display.value += value;
    }

    function calculate() {
      try {
        const result = Function(
          `"use strict"; return (${display.value})`
        )();

        if (!Number.isFinite(result)) {
          throw new Error();
        }

        display.value = result;
        justCalculated = true;
      } catch {
        display.value = "Error";
        justCalculated = true;
      }
    }

    document.addEventListener("keydown", event => {
      if (/[0-9+\-*/.]/.test(event.key)) {
        addValue(event.key);
      } else if (event.key === "Enter") {
        calculate();
      } else if (event.key === "Backspace") {
        display.value = display.value.slice(0, -1) || "0";
      } else if (event.key === "Escape") {
        display.value = "0";
      }
    });
  </script>

</body>
</html>
